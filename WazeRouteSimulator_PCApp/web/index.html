<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waze Route Simulator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#111;color:#fff;overflow:hidden}
*{box-sizing:border-box}
#app{display:grid;grid-template-columns:360px 1fr;width:100%;height:100%}
#side{background:#181b20;border-right:1px solid #30343b;padding:14px;overflow:auto}
#map{width:100%;height:100%;background:#222}
h1{font-size:20px;margin:0 0 12px}
.section{background:#22262d;border:1px solid #343943;border-radius:8px;padding:10px;margin-bottom:10px}
.title{font-size:13px;font-weight:bold;margin-bottom:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.row.one{grid-template-columns:1fr}
button,input{width:100%;height:34px;border:1px solid #414752;border-radius:5px;background:#101318;color:#fff;padding:0 8px}
button{cursor:pointer;background:#2b313a}
button:hover{background:#39414d}
button.primary{background:#087ec1}
button.danger{background:#8e2929}
label{display:block;font-size:11px;color:#c9ced6;margin-bottom:4px}
#status{font-family:Consolas,monospace;font-size:11px;white-space:pre-wrap;line-height:1.45;color:#b7e3ff}
.segment-row{display:grid;grid-template-columns:55px 1fr 70px;gap:6px;align-items:center;font-size:12px;padding:5px;border-radius:4px}
.segment-row.selected{background:#164c69}
.badge{display:inline-block;border-radius:10px;padding:2px 7px;background:#333;font-size:11px}
.help{font-size:11px;line-height:1.4;color:#aeb5bf}
@media(max-width:850px){#app{grid-template-columns:1fr;grid-template-rows:390px 1fr}#side{border-right:0;border-bottom:1px solid #30343b}}
</style>
</head>
<body>
<div id="app">
<div id="side">
<h1>Waze Route Simulator</h1>

<div class="section">
<div class="title">USB phone</div>
<div class="row">
<button id="deviceBtn">Detect phone</button>
<button id="statusBtn">Refresh status</button>
</div>
<div id="deviceState" class="help">Not checked.</div>
</div>

<div class="section">
<div class="title">Route</div>
<div class="row">
<button id="clearBtn" class="danger">Clear route</button>
<button id="undoBtn">Undo point</button>
</div>
<div class="row">
<button id="saveBtn">Save JSON</button>
<label style="margin:0"><input id="loadInput" type="file" accept=".json" style="padding-top:6px"></label>
</div>
<div class="help">Click map to add points. Drag markers to adjust them.</div>
</div>

<div class="section">
<div class="title">Selected segments</div>
<div class="row">
<div><label>Speed km/h</label><input id="speedInput" type="number" min="1" max="300" value="30"></div>
<div><label>Update rate Hz</label><input id="hzInput" type="number" min="1" max="20" value="8"></div>
</div>
<div class="row one">
<label style="display:flex;align-items:center;gap:8px;color:#fff">
<input id="holdLastLocation" type="checkbox" checked style="width:auto;height:auto">
Continuously send last location after Stop
</label>
</div>
<div class="row one"><button id="applySpeedBtn">Apply speed to selected</button></div>
<div id="segments"></div>
</div>

<div class="section">
<div class="title">Phone playback</div>
<div class="row">
<button id="sendBtn" class="primary">Send Route</button>
<button id="playBtn" class="primary">Play</button>
</div>
<div class="row">
<button id="pauseBtn">Pause</button>
<button id="stopBtn" class="danger">Stop</button>
</div>
</div>

<div class="section">
<div class="title">Live status</div>
<div id="status">Waiting.</div>
</div>

<div class="section help">
Segment selection:
<br>Click = select one
<br>Ctrl+click = toggle
<br>Shift+click = select range
</div>
</div>
<div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
    var map = L.map("map").setView([44.4268,26.1025],13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
        maxZoom:20,
        attribution:"© OpenStreetMap contributors"
    }).addTo(map);

    var points = [];
    var speeds = [];
    var markers = [];
    var lines = [];
    var selected = {};
    var lastSelected = null;
    var liveMarker = null;

    function api(path, method, body){
        return fetch(path,{
            method:method || "GET",
            headers:{"Content-Type":"application/json"},
            body:body ? JSON.stringify(body) : undefined
        }).then(function(r){return r.json();});
    }

    function distanceMeters(a,b){
        var R=6371000;
        var p1=a.lat*Math.PI/180;
        var p2=b.lat*Math.PI/180;
        var dp=(b.lat-a.lat)*Math.PI/180;
        var dl=(b.lng-a.lng)*Math.PI/180;
        var x=Math.sin(dp/2)*Math.sin(dp/2)+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);
        return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
    }

    function ensureSpeeds(){
        while(speeds.length < Math.max(0,points.length-1)){speeds.push(30);}
        speeds.length=Math.max(0,points.length-1);
    }

    function selectedIndexes(){
        return Object.keys(selected).filter(function(k){return selected[k];}).map(Number).sort(function(a,b){return a-b;});
    }

    function selectSegment(index,event){
        if(event && event.shiftKey && lastSelected !== null){
            selected={};
            var a=Math.min(lastSelected,index),b=Math.max(lastSelected,index),i;
            for(i=a;i<=b;i++){selected[i]=true;}
        }else if(event && (event.ctrlKey || event.metaKey)){
            selected[index]=!selected[index];
            lastSelected=index;
        }else{
            selected={};
            selected[index]=true;
            lastSelected=index;
        }
        render();
    }

    function render(){
        ensureSpeeds();
        markers.forEach(function(m){map.removeLayer(m);});
        lines.forEach(function(l){map.removeLayer(l);});
        markers=[]; lines=[];

        points.forEach(function(p,i){
            var marker=L.marker([p.lat,p.lng],{draggable:true}).addTo(map);
            marker.bindTooltip(String(i+1),{permanent:true,direction:"top"});
            marker.on("drag",function(e){
                var ll=e.target.getLatLng();
                points[i]={lat:ll.lat,lng:ll.lng};
                render();
            });
            marker.on("contextmenu",function(){
                points.splice(i,1);
                if(i < speeds.length){speeds.splice(Math.max(0,i-1),1);}
                selected={};
                render();
            });
            markers.push(marker);
        });

        for(var i=0;i<points.length-1;i++){
            (function(index){
                var isSel=!!selected[index];
                var line=L.polyline(
                    [[points[index].lat,points[index].lng],[points[index+1].lat,points[index+1].lng]],
                    {color:isSel?"#ff9b25":"#22b9ff",weight:isSel?8:5,opacity:.95}
                ).addTo(map);
                line.on("click",function(e){L.DomEvent.stopPropagation(e);selectSegment(index,e.originalEvent);});
                lines.push(line);
            })(i);
        }

        var html="";
        for(var j=0;j<speeds.length;j++){
            html+='<div class="segment-row '+(selected[j]?'selected':'')+'" data-index="'+j+'">';
            html+='<span>#'+(j+1)+'</span>';
            html+='<span>'+Math.round(distanceMeters(points[j],points[j+1]))+' m</span>';
            html+='<span>'+speeds[j]+' km/h</span></div>';
        }
        document.getElementById("segments").innerHTML=html;
        Array.prototype.forEach.call(document.querySelectorAll(".segment-row"),function(row){
            row.onclick=function(e){selectSegment(parseInt(row.getAttribute("data-index"),10),e);};
        });
    }

    map.on("click",function(e){
        points.push({lat:e.latlng.lat,lng:e.latlng.lng});
        ensureSpeeds();
        render();
    });

    function routePayload(){
        ensureSpeeds();
        return {
            name:"Waze debug route",
            updateHz:Math.max(1,Math.min(20,parseInt(document.getElementById("hzInput").value,10)||8)),
            holdLastLocation:document.getElementById("holdLastLocation").checked,
            points:points.map(function(p){return {lat:p.lat,lon:p.lng};}),
            segments:speeds.map(function(s,i){return {from:i,to:i+1,speedKmh:Number(s)};})
        };
    }

    document.getElementById("applySpeedBtn").onclick=function(){
        var value=Math.max(1,Math.min(300,Number(document.getElementById("speedInput").value)||30));
        selectedIndexes().forEach(function(i){speeds[i]=value;});
        render();
    };
    document.getElementById("clearBtn").onclick=function(){points=[];speeds=[];selected={};render();};
    document.getElementById("undoBtn").onclick=function(){if(points.length){points.pop();speeds.length=Math.max(0,points.length-1);selected={};render();}};
    document.getElementById("deviceBtn").onclick=function(){
        api("/api/device").then(function(r){document.getElementById("deviceState").textContent=r.ok?"Connected: "+r.device:"Error: "+r.error;});
    };
    document.getElementById("statusBtn").onclick=function(){pollStatus();};
    document.getElementById("sendBtn").onclick=function(){
        if(points.length<2){alert("Add at least two points.");return;}
        api("/api/route","POST",routePayload()).then(showResult);
    };
    document.getElementById("playBtn").onclick=function(){api("/api/play","POST",{}).then(showResult);};
    document.getElementById("pauseBtn").onclick=function(){api("/api/pause","POST",{}).then(showResult);};
    document.getElementById("stopBtn").onclick=function(){api("/api/stop","POST",{}).then(showResult);};
    document.getElementById("saveBtn").onclick=function(){
        var blob=new Blob([JSON.stringify(routePayload(),null,2)],{type:"application/json"});
        var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="waze-debug-route.json";a.click();URL.revokeObjectURL(a.href);
    };
    document.getElementById("loadInput").onchange=function(e){
        var file=e.target.files[0];if(!file){return;}
        var reader=new FileReader();
        reader.onload=function(){
            var data=JSON.parse(reader.result);
            points=(data.points||[]).map(function(p){return {lat:Number(p.lat),lng:Number(p.lon)};});
            speeds=(data.segments||[]).map(function(s){return Number(s.speedKmh)||30;});
            selected={};render();
            if(points.length){map.fitBounds(points.map(function(p){return [p.lat,p.lng];}),{padding:[30,30]});}
        };
        reader.readAsText(file);
    };

    function showResult(r){
        document.getElementById("status").textContent=JSON.stringify(r,null,2);
    }

    function pollStatus(){
        api("/api/status").then(function(r){
            document.getElementById("status").textContent=JSON.stringify(r,null,2);
            if(r.ok && r.location && typeof r.location.lat==="number"){
                var ll=[r.location.lat,r.location.lon];
                if(!liveMarker){liveMarker=L.circleMarker(ll,{radius:9,color:"#fff",fillColor:"#ff3030",fillOpacity:1,weight:3}).addTo(map);}
                else{liveMarker.setLatLng(ll);}
            }
        }).catch(function(e){
            document.getElementById("status").textContent=String(e);
        });
    }

    setInterval(pollStatus,500);
    render();
})();
</script>
</body>
</html>
